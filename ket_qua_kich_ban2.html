<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mô phỏng DMAN - VVTS</title>
    <style>
        :root {
            --bg: #090d16; --panel-bg: #111827;
            --text: #f8fafc; --text-muted: #64748b;
            --blue-card: #1e293b; --blue-border: #3b82f6;
            --green-card: #064e3b; --green-border: #10b981;
            --medical-card: #7f1d1d; --medical-border: #ef4444;
            --vip-card: #78350f; --vip-border: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 25px; overflow-x: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #1f2937; padding-bottom: 15px; }
        .title-zone h2 { color: #f8fafc; font-size: 21px; }
        .title-zone p { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

        .clock-container { background: #1f2937; border: 2px solid var(--blue-border); padding: 8px 24px; border-radius: 8px; text-align: center; min-width: 180px; }
        #sim-clock { font-size: 26px; font-weight: bold; color: #60a5fa; font-family: monospace; }
        
        .controls { display: flex; gap: 20px; align-items: center; background: #111827; padding: 10px 20px; border-radius: 8px; border: 1px solid #1f2937; }
        button { padding: 10px 24px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: var(--blue-border); color: white; font-size: 14px; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .speed-ctrl { color: var(--text-muted); font-size: 13px; display: flex; align-items: center; gap: 10px; }
        input[type=range] { cursor: pointer; width: 120px; }

        .main-layout { max-width: 950px; margin: 0 auto; background: var(--panel-bg); border-radius: 12px; border: 1px solid #1f2937; padding: 25px; display: flex; flex-direction: column; height: calc(100vh - 130px); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #1f2937; }
        .panel-title { font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; }
        #dman-status { font-weight: bold; font-size: 14px; color: #f59e0b; }

        .queue-viewport { position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; border: 2px dashed #1f2937; border-radius: 8px; padding: 15px; background: #070a12; scroll-behavior: smooth; }
        
        .flight-card {
            position: absolute; left: 15px; right: 15px; height: 85px;
            border-radius: 8px; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            opacity: 0; transform: translateY(150px);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s, background-color 0.4s, left 0.5s ease-in-out;
            z-index: 2;
        }
        .flight-card.active { opacity: 1; }

        .flight-card.arr { background-color: var(--green-card); border-left: 6px solid var(--green-border); border: 1px solid rgba(16, 185, 129, 0.15); }
        .flight-card.dep { background-color: var(--blue-card); border-left: 6px solid var(--blue-border); border: 1px solid rgba(59, 130, 246, 0.15); }
        .flight-card.vip { background-color: var(--vip-card) !important; border-left: 6px solid var(--vip-border) !important; }
        .flight-card.medical { background-color: var(--medical-card) !important; border-left: 6px solid var(--medical-border) !important; }
        
        .flight-card.pulling-out {
            left: 50px;
            box-shadow: -10px 15px 30px rgba(0, 0, 0, 0.6);
            z-index: 999 !important;
            filter: brightness(1.3);
            border: 2px solid #ffffff !important;
        }

        .card-left { display: flex; align-items: center; gap: 20px; }
        .card-right { display: flex; align-items: center; gap: 30px; font-family: monospace; }
        .time-column { display: flex; flex-direction: column; align-items: flex-end; }
        .time-column + .time-column { border-left: 2px solid #334155; padding-left: 20px; }

        .acid-block { font-family: monospace; }
        .acid-text { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
        .meta-text { font-size: 12px; color: #94a3b8; margin-top: 2px; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; min-width: 55px; }
        .badge.arr-tag { background: #10b981; color: #042f1a; }
        .badge.dep-tag { background: #3b82f6; color: #1e3a8a; }
        .badge.vip-tag { background: #f59e0b; color: #78350f; }
        .badge.medical-tag { background: #ef4444; color: white; }
        .badge.pri-tag { background: #ef4444; color: white; }

        .gate-block { background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.05); font-size: 12px; font-weight: 600; color: #cbd5e1; }
        .time-label { font-size: 10px; color: #94a3b8; margin-bottom: 1px; }
        .time-value { font-size: 14px; font-weight: bold; color: #60a5fa; }
        .dman-value { font-size: 14px; font-weight: bold; color: #fbbf24; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-zone">
            <h2>MÔ PHỎNG THUẬT TOÁN ĐIỀU PHỐI DMAN</h2>
            <p>Điều kiện DMAN: Chỉ hoán đổi vị trí đối với các chuyến bay có chênh lệch thời gian dự kiến dưới 5 phút (&lt; 300s)</p>
        </div>
        
        <div class="controls">
            <button id="btn-play" onclick="toggleSim()">BẮT ĐẦU MÔ PHỎNG</button>
            <div class="speed-ctrl">
                <span>Tốc độ:</span>
                <input type="range" id="speed" min="5" max="60" value="20" onchange="updateSpeed()">
                <span id="speed-val" style="font-weight: bold; color: #60a5fa;">20x</span>
            </div>
            <div class="clock-container">
                <div style="font-size: 10px; color: var(--text-muted); font-weight: 600;">ĐỒNG HỒ HỆ THỐNG</div>
                <div id="sim-clock">08:00:00</div>
            </div>
        </div>
    </div>

    <div class="main-layout">
        <div class="panel-header">
            <div class="panel-title">📋 TRỤC ĐIỀU PHỐI CHUNG TẬP TRUNG</div>
            <div id="dman-status">Hệ thống đang sẵn sàng...</div>
        </div>
        <div class="queue-viewport" id="main-queue-container"></div>
    </div>

    <script>
        const rawData = [{"acid": "VJC370", "type": "ARR", "ac_type": "A320", "wake": "M", "priority": "Normal", "gate": "\u2013", "ready_time": 240, "rwy": "25R", "rot": 55, "dman_index": null}, {"acid": "AAR731", "type": "ARR", "ac_type": "B744", "wake": "H", "priority": "Normal", "gate": "\u2013", "ready_time": 450, "rwy": "25R", "rot": 60, "dman_index": null}, {"acid": "BAV1152", "type": "DEP", "ac_type": "B744", "wake": "H", "priority": "Normal", "gate": 20, "ready_time": 529, "rwy": "25L", "rot": 50, "dman_index": 499}, {"acid": "PIC442", "type": "DEP", "ac_type": "A320", "wake": "M", "priority": "VIP", "gate": 19, "ready_time": 719, "rwy": "25L", "rot": 45, "dman_index": 569}, {"acid": "VJC390", "type": "DEP", "ac_type": "A320", "wake": "M", "priority": "Normal", "gate": 22, "ready_time": 744, "rwy": "25L", "rot": 45, "dman_index": 714}, {"acid": "CPA767", "type": "DEP", "ac_type": "A320", "wake": "M", "priority": "Normal", "gate": 8, "ready_time": 809, "rwy": "25L", "rot": 45, "dman_index": 779}, {"acid": "SIA178", "type": "ARR", "ac_type": "B744", "wake": "H", "priority": "Normal", "gate": "\u2013", "ready_time": 840, "rwy": "25R", "rot": 60, "dman_index": null}, {"acid": "HVN1182", "type": "DEP", "ac_type": "A321", "wake": "M", "priority": "Normal", "gate": 11, "ready_time": 974, "rwy": "25L", "rot": 45, "dman_index": 944}, {"acid": "CSN3069", "type": "ARR", "ac_type": "A321", "wake": "M", "priority": "Normal", "gate": "\u2013", "ready_time": 990, "rwy": "25R", "rot": 55, "dman_index": null}, {"acid": "MAS768", "type": "DEP", "ac_type": "B744", "wake": "H", "priority": "Normal", "gate": 16, "ready_time": 1164, "rwy": "25L", "rot": 50, "dman_index": 1134}, {"acid": "JAL750", "type": "DEP", "ac_type": "B744", "wake": "H", "priority": "Normal", "gate": 13, "ready_time": 1179, "rwy": "25L", "rot": 50, "dman_index": 1149}, {"acid": "CAL5874", "type": "ARR", "ac_type": "B744", "wake": "H", "priority": "Normal", "gate": "\u2013", "ready_time": 1260, "rwy": "25R", "rot": 60, "dman_index": null}, {"acid": "HVN3356", "type": "DEP", "ac_type": "B744", "wake": "H", "priority": "Medical", "gate": 10, "ready_time": 1509, "rwy": "25L", "rot": 50, "dman_index": 1299}, {"acid": "HVN1356", "type": "DEP", "ac_type": "A321", "wake": "M", "priority": "Normal", "gate": 1, "ready_time": 1484, "rwy": "25L", "rot": 45, "dman_index": 1454}, {"acid": "VJC123", "type": "DEP", "ac_type": "A320", "wake": "M", "priority": "Normal", "gate": 5, "ready_time": 1494, "rwy": "25L", "rot": 45, "dman_index": 1464}, {"acid": "KLM836", "type": "DEP", "ac_type": "B744", "wake": "H", "priority": "Normal", "gate": 7, "ready_time": 1644, "rwy": "25L", "rot": 50, "dman_index": 1614}, {"acid": "QAN751", "type": "DEP", "ac_type": "A320", "wake": "M", "priority": "Normal", "gate": 14, "ready_time": 1659, "rwy": "25L", "rot": 45, "dman_index": 1629}, {"acid": "CPA765", "type": "ARR", "ac_type": "A320", "wake": "M", "priority": "Normal", "gate": "\u2013", "ready_time": 1740, "rwy": "25R", "rot": 55, "dman_index": null}, {"acid": "TGW123", "type": "DEP", "ac_type": "A321", "wake": "M", "priority": "Normal", "gate": 3, "ready_time": 1994, "rwy": "25L", "rot": 45, "dman_index": 1964}, {"acid": "BAV1158", "type": "ARR", "ac_type": "A320", "wake": "M", "priority": "Normal", "gate": "\u2013", "ready_time": 2040, "rwy": "25R", "rot": 55, "dman_index": null}];
        let simTime = 180;
        const endTime = 2640;
        let isRunning = false;
        let simInterval = null;
        let simSpeed = 20; 
        let activeFlights = [];

        function fmtSec(sec) {
            let total = sec + (8 * 3600);
            let h = Math.floor(total / 3600);
            let m = Math.floor((total % 3600) / 60);
            let s = total % 60;
            return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        function updateSpeed() {
            simSpeed = document.getElementById('speed').value;
            document.getElementById('speed-val').innerText = simSpeed + "x";
            if(isRunning) { clearInterval(simInterval); isRunning = false; toggleSim(); }
        }

        function toggleSim() {
            const btn = document.getElementById('btn-play');
            if(isRunning) {
                clearInterval(simInterval);
                btn.innerText = "TIẾP TỤC"; btn.style.background = "#3b82f6";
                isRunning = false;
            } else {
                isRunning = true;
                btn.innerText = "TẠM DỪNG"; btn.style.background = "#475569";
                simInterval = setInterval(() => {
                    simTime += 1;
                    document.getElementById('sim-clock').innerText = fmtSec(simTime);
                    checkNewFlights();
                    if (simTime >= endTime) { clearInterval(simInterval); document.getElementById('dman-status').innerText = "🏁 HOÀN THÀNH MÔ PHỎNG"; }
                }, 1000 / simSpeed);
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('main-queue-container');
            if (container) container.scrollTop = container.scrollHeight;
        }

        function checkNewFlights() {
            rawData.forEach(f => { if (f.ready_time === simTime) { insertFlightToQueue(f); } });
        }

        function insertFlightToQueue(flight) {
            const container = document.getElementById('main-queue-container');
            const card = document.createElement('div');
            card.id = `card-${flight.acid}`;
            card.className = `flight-card ${flight.type.toLowerCase()} ${flight.priority.toLowerCase() !== 'normal' ? flight.priority.toLowerCase() : ''}`;
            
            let typeTag = '';
            if (flight.type === 'ARR') {
                typeTag = '<span class="badge arr-tag">🛬 ARR</span>';
            } else {
                if (flight.priority === 'VIP') {
                    typeTag = '<span class="badge vip-tag">⭐ VIP</span>';
                } else if (flight.priority === 'Medical') {
                    typeTag = '<span class="badge medical-tag">🏥 Medical</span>';
                } else {
                    typeTag = '<span class="badge dep-tag">🛫 DEP</span>';
                }
            }
            
            let priTag = flight.priority !== 'Normal' ? `<span class="badge pri-tag">⚠️ ${flight.priority}</span>` : '';
            
            let dmanDisplay = '';
            if (flight.dman_index !== undefined && flight.dman_index !== null) {
                dmanDisplay = `
                    <div class="time-label">DMAN Index</div>
                    <div class="dman-value">${fmtSec(flight.dman_index)}</div>
                `;
            } else {
                dmanDisplay = `<div class="time-label" style="color:#64748b;">—</div>`;
            }

            card.innerHTML = `
                <div class="card-left">
                    ${typeTag}
                    <div class="acid-block">
                        <div class="acid-text">${flight.acid} <span style="font-size:13px; color:#94a3b8; font-weight:normal;">(${flight.ac_type})</span></div>
                        <div class="meta-text">Phân cách: ${flight.wake}</div>
                    </div>
                    <div class="gate-block">${flight.gate}</div>
                    ${priTag}
                </div>
                <div class="card-right">
                    <div class="time-column">
                        <div class="time-label">FCFS</div>
                        <div class="time-value">${fmtSec(flight.ready_time)}</div>
                    </div>
                    <div class="time-column">
                        ${dmanDisplay}
                    </div>
                </div>
            `;
            
            container.appendChild(card);
            setTimeout(() => {
                card.classList.add('active');
                scrollToBottom();
            }, 30);

            activeFlights.push(flight);
            recalculateAndRenderPositions(false);

            if (flight.priority !== 'Normal') { executeDMANLogic(flight); }
        }

        // ─── DMAN: HOÁN ĐỔI (CHỈ VỚI DEP) ────────────────────
        function executeDMANLogic(targetFlight) {
            let idx = activeFlights.findIndex(f => f.acid === targetFlight.acid);
            if (idx <= 0) return;

            let swapTargetIdx = -1;
            for (let i = idx - 1; i >= 0; i--) {
                if (activeFlights[i].type !== 'DEP') continue;
                let diff = targetFlight.ready_time - activeFlights[i].ready_time;
                if (diff > 0 && diff <= 300) {
                    swapTargetIdx = i;
                    break;
                } else {
                    break;
                }
            }

            if (swapTargetIdx !== -1) {
                document.getElementById('dman-status').innerText = `⚡ TÀU ƯU TIÊN: ${targetFlight.acid} THỎA MÃN ĐIỀU KIỆN (< 5p) -> THỰC THI HOÁN ĐỔI...`;
                document.getElementById('dman-status').style.color = "#ef4444";

                const targetCard = document.getElementById(`card-${targetFlight.acid}`);
                setTimeout(() => { if (targetCard) targetCard.classList.add('pulling-out'); }, 800);

                setTimeout(() => {
                    activeFlights.splice(idx, 1);
                    activeFlights.splice(swapTargetIdx, 0, targetFlight);
                    recalculateAndRenderPositions(true);
                    scrollToBottom();
                }, 1800);

                setTimeout(() => {
                    if (targetCard) {
                        targetCard.classList.remove('pulling-out');
                        document.getElementById('dman-status').innerText = `✅ DMAN HOÁN ĐỔI THÀNH CÔNG CHO CHUYẾN BAY ${targetFlight.acid}!`;
                        document.getElementById('dman-status').style.color = "#10b981";
                    }
                }, 2800);
            } else {
                document.getElementById('dman-status').innerText = `❌ TỪ CHỐI HOÁN ĐỔI: Không có DEP phù hợp phía trước hoặc chênh lệch quá 5 phút!`;
                document.getElementById('dman-status').style.color = "#64748b";
            }
        }

        function recalculateAndRenderPositions(isSwapTriggered) {
            activeFlights.forEach((flight, index) => {
                const card = document.getElementById(`card-${flight.acid}`);
                if (card) {
                    card.style.transform = `translateY(${index * 98}px)`;
                }
            });
        }
    </script>
</body>
</html>
